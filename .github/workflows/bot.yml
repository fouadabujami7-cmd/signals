name: trading-bot
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # لنشر لوحة التطبيق (فرع bot-data فقط)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-
      - run: python bot.py
        env:
          CAP_API_KEY: ${{ secrets.CAP_API_KEY }}
          CAP_IDENTIFIER: ${{ secrets.CAP_IDENTIFIER }}
          CAP_PASSWORD: ${{ secrets.CAP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: "1"                # نشر بيانات لوحة التطبيق (0 = إيقاف)
          # ===== الحساب: demo أو live =====
          # للحقيقي: CAP_ENV "live" + LIVE_CONFIRM "I_UNDERSTAND" (والمفاتيح الثلاثة أعلاه لحسابك الحقيقي)
          CAP_ENV: "live"
          LIVE_CONFIRM: "I_UNDERSTAND"
          # بلا حدود على الحساب الحقيقي يحتاج أيضاً: LIVE_NO_LIMITS "I_ACCEPT_UNLIMITED_RISK"
          LIVE_NO_LIMITS: "I_ACCEPT_UNLIMITED_RISK"
          # ===== المخاطرة =====
          RISK_PCT: "2"               # أقصى خسارة للصفقة = هذه النسبة من الرصيد (وقف الخسارة عند الوسيط دائماً)
          TRADE_RISK_EUR: "25"        # سقف خسارة الصفقة الواحدة باليورو (0 = بلا سقف)
          MAX_DAILY_LOSS_EUR: "0"     # حد خسارة يومي ثابت باليورو (0 = معطّل)
          MAX_DAILY_LOSS_PCT: "0"     # أو كنسبة من الرصيد (0 = معطّل). الاثنان 0 = بلا حد يومي
          MAX_OPEN: "0"               # أقصى صفقات مفتوحة معاً (0 = بلا حد)
          MAX_NEW_PER_CYCLE: "10"     # صفقات جديدة تُفتح معاً في الدورة الواحدة (5-10)
          MAX_PER_EPIC: "3"           # للذهب والنفط (السهم الواحد صفقة واحدة)
          MAX_MARGIN_PCT: "15"        # أقصى هامش لصفقة سهم كنسبة من الرصيد (0 = بلا سقف)
          BE_TRIGGER: "1"
          GUARANTEED_STOP: "1"
          # ===== الأسهم الأوروبية والأمريكية =====
          STOCKS: "1"
          STOCK_TOP: "20"             # كم سهماً يُحلَّل بالتفصيل كل دورة
          STOCK_MAX_SPREAD_PCT: "0.15"
          STOCK_NODES_RE: "share|stock|aktie|equit|accion|azioni|action"
          STOCK_EPICS: ""             # رموز إضافية يدوياً مفصولة بفاصلة (اختياري)
          # ===== السياق: أخبار + ميول المتداولين (بدل الذكاء الاصطناعي) =====
          USE_AI: "0"                 # 0 = بدون ذكاء اصطناعي (لا يحتاج ANTHROPIC_API_KEY). 1 = يعيد تشغيله
          NEWS_HOURS: "12"            # عمر العناوين المعتبرة
          NEWS_TTL_MIN: "30"          # كم دقيقة يُحفظ تحليل أخبار كل سوق
          SENT_WEIGHT: "0.3"          # وزن ميول متداولي Capital.com (0 = تجاهله)
          SENT_EDGE: "15"
          CTX_VETO: "0.25"            # الأخبار/الميول تمنع الصفقة فقط إذا عاكستها بهذه القوة
          NEWS_BLOCK: "trading halt,halted,bankruptcy,fraud,sec charges,investigation,probe,delisting"
          AI_MIN_GAP_MIN: "30"
          # ===== الاستراتيجية =====
          EPICS: "GOLD,OIL_CRUDE"
          SIZE_RANGES: "GOLD:0.01-10,OIL_CRUDE:1-200"
          ENTRY_THR: "45"
          REBOUND: "1"
          REB_MOVE_ATR: "3"
          REB_RETRACE: "0.5"
          SL_MULT: "2"
          RR: "1.5"
          MAX_HOLD_MIN: "0"
          AI_EVERY_MIN: "60"
          LOOP_MINUTES: "14"
          DRY_RUN: "0"
