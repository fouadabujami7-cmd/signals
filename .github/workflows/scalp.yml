name: scalp
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: scalp
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: write        # لنشر gold.json على فرع gold-data فقط
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: scalp_state.json
          key: scalp-state-${{ github.run_id }}
          restore-keys: scalp-state-
      - run: python gold.py
        env:
          # مفاتيح الحساب التجريبي (إن لم تضفها يستخدم المفاتيح العادية)
          CAP_API_KEY: ${{ secrets.DEMO_CAP_API_KEY || secrets.CAP_API_KEY }}
          CAP_IDENTIFIER: ${{ secrets.DEMO_CAP_IDENTIFIER || secrets.CAP_IDENTIFIER }}
          CAP_PASSWORD: ${{ secrets.DEMO_CAP_PASSWORD || secrets.CAP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOLD_BRANCH: "scalp-data"
          CAP_ENV: "demo"              # تجريبي فقط — الروبوت يرفض العمل على الحقيقي
          STATE_FILE: "scalp_state.json"
          LOOP_MINUTES: "14"
          CYCLE_SECONDS: "20"
          SCAN_PER_CYCLE: "24"         # كم سوق يحلل كل دورة (يدور على كل أسواق كابيتال)
          REC_NODE_CALLS: "60"         # عدد طلبات قراءة قائمة الأسواق (مرة كل 24 ساعة)
          SPREAD_MAX_PCT: "0.4"        # يتجاهل الأسواق ذات السبريد الكبير
          STOCK_NODES_RE: "share|stock|aktie|equit|accion|azioni|action"
          # ===== الخاطف: هامش 100€ بأكبر رافعة، الوقف ضعف الهدف، بلا إغلاق بالوقت =====
          MARGIN_EUR: "100"            # هامش كل صفقة 100 يورو (القيمة = 100 × الرافعة المتاحة للسوق)
          MAX_TRADE_EUR: "50000"
          TP_EUR: "10"                 # الهدف: ربح 10 يورو
          RISK_EUR: "20"               # الوقف: خسارة 20 يورو (ضعف الهدف)
          TRADE_EUR: "0"
          REACH_ATR: "6"               # يتجاهل الصفقة إذا الهدف بعيد جداً عن حركة السوق
          SPREAD_STOP_FRAC: "0.3"
          MIN_ATR_PCT: "0.03"          # لا يدخل إذا السوق شبه ساكن
          MAX_HOLD_MIN: "0"            # بلا إغلاق بالوقت: الصفقة تبقى حتى الهدف أو الوقف
          NEWS_MODE: "require"         # الأخبار: لا يدخل ضد اتجاه الأخبار، ويرفع القوة إذا الأخبار تؤيد
          NEWS_MIN: "0.15"
          NEWS_HOURS: "12"
          NEWS_TTL_MIN: "20"
          MIN_OPEN: "3"
          MAX_PER_EPIC: "1"            # صفقة واحدة فقط لكل سهم/سوق
          G_MAX_OPEN: "5"              # 5 صفقات كحد أقصى (أسوأ حالة 5 × 20 = 100 يورو)
          G_MAX_NEW: "2"
          G_MIN_SCORE: "40"
          G_RELAX_SCORE: "30"
          G_COOLDOWN_MIN: "5"
          DAILY_LOSS_EUR: "200"        # حد الخسارة اليومية: بعد خسارة 200 يورو يتوقف عن فتح صفقات جديدة لباقي اليوم (0 = بلا حد)
          STREAK_N: "3"
          STREAK_PAUSE_MIN: "30"
          BE_AT_R: "0"
          SESSION_GMT: "0-24"          # طول الوقت
          ALLOW_WEEKEND: "1"           # السبت والأحد للأسواق المفتوحة (كريبتو)
          NEWS_BLACKOUT: "13:28-13:38,14:58-15:08"   # دقائق صدور الأرقام الكبرى فقط
          STOP_FILE: "STOP.txt"
