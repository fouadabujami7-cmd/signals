name: gold
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: gold
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: write        # لنشر gold.json على فرع gold-data فقط
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: gold_state.json
          key: gold-state-${{ github.run_id }}
          restore-keys: gold-state-
      - run: python gold.py
        env:
          # مفاتيح الحساب التجريبي (إن لم تضفها يستخدم المفاتيح العادية)
          CAP_API_KEY: ${{ secrets.DEMO_CAP_API_KEY || secrets.CAP_API_KEY }}
          CAP_IDENTIFIER: ${{ secrets.DEMO_CAP_IDENTIFIER || secrets.CAP_IDENTIFIER }}
          CAP_PASSWORD: ${{ secrets.DEMO_CAP_PASSWORD || secrets.CAP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAP_ENV: "demo"              # تجريبي فقط — الروبوت يرفض العمل على الحقيقي
          STATE_FILE: "gold_state.json"
          LOOP_MINUTES: "14"
          CYCLE_SECONDS: "20"
          SCAN_PER_CYCLE: "24"         # كم سوق يحلل كل دورة (يدور على كل أسواق كابيتال)
          REC_NODE_CALLS: "60"         # عدد طلبات قراءة قائمة الأسواق (مرة كل 24 ساعة)
          SPREAD_MAX_PCT: "0.4"        # يتجاهل الأسواق ذات السبريد الكبير
          STOCK_NODES_RE: "share|stock|aktie|equit|accion|azioni|action"
          TRADE_EUR: "500"             # أقل قيمة للصفقة
          MAX_TRADE_EUR: "8000"        # أعلى قيمة (لازم تكبر الصفقة ليكون وقف 50€ منطقي)
          RISK_EUR: "50"               # وقف الخسارة = 50 يورو
          TP_EUR: "50"                 # الهدف = 50 يورو
          MIN_OPEN: "10"               # يحاول إبقاء 10 صفقات أو أكثر معاً
          G_MAX_OPEN: "20"
          G_MAX_NEW: "5"
          G_MIN_SCORE: "35"
          G_RELAX_SCORE: "20"          # إذا الصفقات أقل من 10 يدخل مع الاتجاه مباشرة
          G_COOLDOWN_MIN: "5"
          BE_AT_R: "0"                 # بدون تأمين: وقف وهدف ثابتان
          SESSION_GMT: "0-24"          # طول الوقت (ما عدا عطلة السوق ووقت الأخبار)
          NEWS_BLACKOUT: "13:25-13:40,14:55-15:10"
