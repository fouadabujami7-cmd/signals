name: gold
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: gold
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: write        # لنشر gold.json على فرع gold-data فقط
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: gold_state.json
          key: gold-state-${{ github.run_id }}
          restore-keys: gold-state-
      - run: python gold.py
        env:
          # مفاتيح الحساب التجريبي (إن لم تضفها يستخدم المفاتيح العادية)
          CAP_API_KEY: ${{ secrets.DEMO_CAP_API_KEY || secrets.CAP_API_KEY }}
          CAP_IDENTIFIER: ${{ secrets.DEMO_CAP_IDENTIFIER || secrets.CAP_IDENTIFIER }}
          CAP_PASSWORD: ${{ secrets.DEMO_CAP_PASSWORD || secrets.CAP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAP_ENV: "demo"              # تجريبي فقط — الروبوت يرفض العمل على الحقيقي
          STATE_FILE: "gold_state.json"
          LOOP_MINUTES: "14"
          CYCLE_SECONDS: "45"
          GOLD_EPIC: "GOLD"
          TRADE_EUR: "500"             # قيمة كل صفقة
          G_MAX_OPEN: "5"              # أقصى صفقات معاً (0 = بلا حد)
          G_MAX_NEW: "2"               # أقصى صفقات جديدة بالدورة
          G_RR: "2"                    # الهدف = ضعف الوقف
          G_MIN_SCORE: "60"            # أقل قوة للدخول (قلّلها لصفقات أكثر)
          G_COOLDOWN_MIN: "20"
          G_MAX_RISK_EUR: "100"        # سقف خسارة الصفقة الواحدة
          BE_AT_R: "1"                 # تأمين الصفقة عند ربح = مسافة الوقف
          SESSION_GMT: "7-20"
          BEST_GMT: "13-17"
          NEWS_BLACKOUT: "13:15-13:45,15:00-15:15"
