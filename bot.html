<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12202B">
<title>لوحة الروبوت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F3; --card:#FFFFFF; --ink:#12202B; --muted:#5C6B77; --line:#D5DDE2; --soft:#F4F7F8;
  --buy:#0F7B5F; --buy-bg:#DDF1EA; --sell:#B23A2B; --sell-bg:#F7E1DD;
  --warn:#8A5A00; --warn-bg:#FBEFCB; --accent:#1F4E79; --live:#B23A2B;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E161C; --card:#16222B; --ink:#E6EDF1; --muted:#93A3AF; --line:#26343E; --soft:#1B2933;
    --buy:#3DC59B; --buy-bg:#123A2F; --sell:#F07A68; --sell-bg:#44201B;
    --warn:#E8B23C; --warn-bg:#3A2D0E; --accent:#7FB2E5; --live:#F07A68;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161C; --card:#16222B; --ink:#E6EDF1; --muted:#93A3AF; --line:#26343E; --soft:#1B2933;
  --buy:#3DC59B; --buy-bg:#123A2F; --sell:#F07A68; --sell-bg:#44201B;
  --warn:#E8B23C; --warn-bg:#3A2D0E; --accent:#7FB2E5; --live:#F07A68;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  font-size:15px;line-height:1.55;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* ===== الرأس ===== */
header{background:#12202B;color:#E6EDF1;padding:calc(14px + env(safe-area-inset-top,0px)) 0 18px}
header .wrap{display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:15px;font-weight:600;margin:0;color:#B9C7D1}
.chips{display:flex;gap:8px;align-items:center}
.chip{font-size:12.5px;font-weight:600;border-radius:99px;padding:3px 11px;border:1px solid transparent;white-space:nowrap}
.chip.demo{background:#22333F;color:#C9D6DF}
.chip.livec{background:#F07A68;color:#2A0B06}
.chip.dry{background:#3A2D0E;color:#E8B23C}
.status{display:flex;align-items:center;gap:7px;font-size:13px;color:#B9C7D1}
.dot{width:9px;height:9px;border-radius:50%;background:#6E7F8B}
.dot.ok{background:#3DC59B}
.dot.late{background:#E8B23C}
.dot.off{background:#F07A68}
.dot.ok.pulse{animation:pulse 2.4s ease-out 1}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,197,155,.6)}100%{box-shadow:0 0 0 10px rgba(61,197,155,0)}}
.bal{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.bal .big{font-size:40px;font-weight:700;line-height:1.05;letter-spacing:-.5px}
.bal .big small{font-size:18px;font-weight:500;color:#B9C7D1;margin-inline-start:6px}
.bal .day{text-align:start;font-size:13px;color:#B9C7D1}
.bal .day b{display:block;font-size:20px;font-weight:600}
.pos{color:#3DC59B}.neg{color:#F07A68}
.livebar{background:var(--live);color:#fff;text-align:center;font-weight:600;font-size:13.5px;padding:6px 12px}
.banner{margin:14px 0 0;padding:11px 13px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:14px}
.banner.err{background:var(--sell-bg);color:var(--sell)}

/* ===== العناصر العامة ===== */
section.tab{display:none;padding-top:16px}
section.tab.on{display:block}
h2{font-size:16px;font-weight:600;margin:22px 0 10px}
h2:first-child{margin-top:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.empty{color:var(--muted);text-align:center;padding:22px 10px;background:var(--card);border:1px dashed var(--line);border-radius:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag{font-size:12.5px;font-weight:600;border-radius:6px;padding:1px 8px}
.tag.buy{background:var(--buy-bg);color:var(--buy)}
.tag.sell{background:var(--sell-bg);color:var(--sell)}
.tag.neutral{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.muted{color:var(--muted)}
.small{font-size:13px}
.up{color:var(--buy)}.down{color:var(--sell)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kv div{background:var(--soft);border-radius:8px;padding:6px 8px}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv b{font-weight:600;font-size:14px}

/* ===== مسار الصفقة: الوقف - الدخول - الهدف ===== */
.track{direction:ltr;position:relative;height:30px;margin:22px 2px 4px}
.track .bar{position:absolute;top:12px;height:6px;border-radius:3px}
.track .seg-stop{background:var(--sell-bg);border:1px solid var(--sell)}
.track .seg-tgt{background:var(--buy-bg);border:1px solid var(--buy)}
.track .entry{position:absolute;top:6px;width:2px;height:18px;background:var(--muted)}
.track .now{position:absolute;top:7px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--ink);border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--ink)}
.track .lbl{position:absolute;top:-16px;font-size:12px;color:var(--muted);white-space:nowrap}
.track .lbl.l{left:0}.track .lbl.r{right:0}
.track .lbl.s{color:var(--sell)}.track .lbl.t{color:var(--buy)}

/* ===== العمليات ===== */
.day-h{font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 8px}
.ev{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .t{font-size:13px;color:var(--muted);padding-top:2px}
.ev .name{font-weight:600}
.ev .why{font-size:13.5px;color:var(--muted);margin-top:6px}
details summary{cursor:pointer;color:var(--accent);font-size:13px;margin-top:6px;list-style:none}
details summary::-webkit-details-marker{display:none}
details ul{margin:6px 0 0;padding:0 18px 0 0;font-size:13.5px}
.pnl{font-weight:700}

/* ===== السوق ===== */
.meter{direction:ltr;position:relative;height:8px;border-radius:4px;background:var(--soft);border:1px solid var(--line);margin:8px 0 4px}
.meter i{position:absolute;top:0;bottom:0}
.meter::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.meter-l{direction:ltr;display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.crowd{direction:ltr;display:flex;height:6px;border-radius:3px;overflow:hidden;margin:6px 0 2px}
.crowd i{display:block}
.heads{margin:8px 0 0;padding:0 16px 0 0;font-size:13.5px}
.heads li{margin-bottom:3px}

/* ===== السجل ===== */
.logbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.7;max-height:70vh;overflow:auto}
.logbox div{border-bottom:1px solid var(--line);padding:2px 0;word-break:break-word}
.logbox div:last-child{border-bottom:0}

/* ===== الشريط السفلي ===== */
nav{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
nav .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding:0 6px}
nav button{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;color:var(--muted);cursor:pointer;border-radius:10px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent);font-weight:600}
nav button:focus-visible,.refresh:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.refresh{background:none;border:1px solid #3A4C59;color:#C9D6DF;border-radius:8px;padding:2px 10px;font-size:12.5px;cursor:pointer}
@media (prefers-reduced-motion: reduce){.dot.ok.pulse{animation:none}}
</style>
</head>
<body>
<div id="livebar" class="livebar" hidden>حساب حقيقي: كل الصفقات هنا بأموالك الفعلية</div>
<header>
  <div class="wrap">
    <div class="top">
      <h1>روبوت التداول</h1>
      <div class="chips"><span id="modeChip" class="chip demo">...</span><span id="dryChip" class="chip dry" hidden>بدون تنفيذ</span></div>
    </div>
    <div class="bal">
      <div><div class="big num" id="bal">—</div><div class="status" style="margin-top:6px"><span id="dot" class="dot"></span><span id="stat">جارٍ التحميل</span> <button class="refresh" id="refresh" type="button">تحديث</button></div></div>
      <div class="day"><span>نتيجة اليوم</span><b class="num" id="day">—</b></div>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="banner"></div>

  <section class="tab on" id="tab-now">
    <h2>الصفقات المفتوحة</h2>
    <div id="open"></div>
    <h2>إعدادات الحماية الحالية</h2>
    <div class="card small" id="settings"></div>
  </section>

  <section class="tab" id="tab-ops">
    <h2>آخر العمليات</h2>
    <div class="card" id="events"></div>
    <h2>نتائج الصفقات المغلقة</h2>
    <div class="card" id="history"></div>
  </section>

  <section class="tab" id="tab-mkt">
    <h2>ماذا يرى الروبوت الآن</h2>
    <div class="small muted" id="scan" style="margin:-4px 0 10px"></div>
    <div id="markets"></div>
  </section>

  <section class="tab" id="tab-log">
    <h2>سجل الروبوت</h2>
    <div class="logbox" id="log"></div>
  </section>
</main>

<nav><div class="wrap">
  <button data-tab="now" class="on" type="button"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg>الآن</button>
  <button data-tab="ops" type="button"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>العمليات</button>
  <button data-tab="mkt" type="button"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4zM9 9h6M9 13h6"/></svg>السوق والأخبار</button>
  <button data-tab="log" type="button"><svg viewBox="0 0 24 24"><path d="M5 7l5 5-5 5M12 18h7"/></svg>السجل</button>
</div></nav>

<script>
"use strict";
var REPO = "fouadabujami7-cmd/signals";
var qs = new URLSearchParams(location.search);
var SRC = qs.get("src") || ("https://raw.githubusercontent.com/" + (qs.get("repo") || REPO) + "/bot-data/bot.json");
var TZ = "Europe/Berlin";
var D = null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fmt(n, d){ if (n == null || isNaN(n)) return "—"; d = d == null ? 2 : d; return Number(n).toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d}); }
function px(n){ if (n == null || isNaN(n)) return "—"; n = Number(n); return fmt(n, n >= 100 ? 2 : n >= 1 ? 3 : 4); }
function signed(n){ if (n == null || isNaN(n)) return "—"; return (n > 0 ? "+" : "") + fmt(n, 2); }
function cur(){ return D && D.currency === "EUR" ? "€" : (D && D.currency) || ""; }
function hm(iso){ try { return new Date(iso).toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit", timeZone:TZ}); } catch(e){ return ""; } }
function dayKey(iso){ try { return new Date(iso).toLocaleDateString("en-CA", {timeZone:TZ}); } catch(e){ return ""; } }
function dayLabel(key){
  var now = new Date(), t = now.toLocaleDateString("en-CA", {timeZone:TZ});
  var y = new Date(now.getTime() - 864e5).toLocaleDateString("en-CA", {timeZone:TZ});
  if (key === t) return "اليوم"; if (key === y) return "أمس";
  var p = key.split("-"); return p[2] + "." + p[1] + "." + p[0];
}
function ago(ms){ var m = Math.floor(ms / 60000); if (m < 1) return "الآن"; if (m < 60) return "قبل " + m + " د"; var h = Math.floor(m / 60); return "قبل " + h + " س" + (m % 60 ? " و" + (m % 60) + " د" : ""); }
function dirTag(d){ return d === "BUY" ? '<span class="tag buy">شراء</span>' : '<span class="tag sell">بيع</span>'; }

/* ===== الرسم ===== */
function renderHead(){
  var live = D.mode === "live";
  $("livebar").hidden = !live;
  var mc = $("modeChip"); mc.textContent = live ? "حقيقي" : "تجريبي"; mc.className = "chip " + (live ? "livec" : "demo");
  $("dryChip").hidden = !D.dry_run;
  $("bal").innerHTML = D.balance == null ? "—" : fmt(D.balance, 2) + "<small>" + esc(cur()) + "</small>";
  var dayEl = $("day"); dayEl.textContent = signed(D.day_pnl) + " " + cur();
  dayEl.className = "num " + (D.day_pnl > 0 ? "pos" : D.day_pnl < 0 ? "neg" : "");
  var age = Date.now() - Date.parse(D.updated), dot = $("dot"), st = $("stat"), b = $("banner");
  if (isNaN(age)) { dot.className = "dot"; st.textContent = "بيانات غير مفهومة"; return; }
  if (age < 5 * 60000) { dot.className = "dot ok pulse"; st.textContent = "يعمل، آخر تحديث " + ago(age); b.innerHTML = ""; }
  else if (age < 20 * 60000) { dot.className = "dot late"; st.textContent = "متأخر، آخر تحديث " + ago(age); b.innerHTML = ""; }
  else { dot.className = "dot off"; st.textContent = "متوقف، آخر تحديث " + ago(age);
    b.innerHTML = '<div class="banner">الروبوت متوقف أو الجدولة معطّلة. افتح GitHub ثم Actions ثم trading-bot وتأكد أنه مفعّل. الصفقات المفتوحة تبقى محمية بوقف الخسارة عند الوسيط.</div>'; }
}

function trackHtml(p){
  var stop = Number(p.stop), tgt = Number(p.target), ent = Number(p.entry), now = Number(p.now);
  if (!isFinite(stop) || !isFinite(tgt) || !isFinite(ent)) return "";
  var lo = Math.min(stop, tgt), hi = Math.max(stop, tgt), span = hi - lo || 1;
  function pos(v){ return Math.max(0, Math.min(100, (v - lo) / span * 100)); }
  var eP = pos(ent), nP = isFinite(now) ? pos(now) : eP;
  var stopLeft = stop < tgt;           /* شراء: الوقف يسار */
  var segS = stopLeft ? 'left:0;width:' + eP + '%' : 'left:' + eP + '%;width:' + (100 - eP) + '%';
  var segT = stopLeft ? 'left:' + eP + '%;width:' + (100 - eP) + '%' : 'left:0;width:' + eP + '%';
  var cS = stopLeft ? 'l' : 'r', cT = stopLeft ? 'r' : 'l';
  return '<div class="track" aria-hidden="true">' +
    '<div class="bar seg-stop" style="' + segS + '"></div><div class="bar seg-tgt" style="' + segT + '"></div>' +
    '<div class="entry" style="left:' + eP + '%"></div><div class="now" style="left:' + nP + '%"></div>' +
    '<span class="lbl s ' + cS + '">وقف ' + px(stop) + '</span><span class="lbl t ' + cT + '">هدف ' + px(tgt) + '</span></div>';
}

function renderOpen(){
  var el = $("open");
  if (!D.open || !D.open.length) { el.innerHTML = '<div class="empty">لا توجد صفقات مفتوحة. الروبوت ينتظر فرصة تحقق الشروط.</div>'; return; }
  el.innerHTML = D.open.map(function(p){
    var upl = Number(p.upl), cls = upl > 0 ? "up" : upl < 0 ? "down" : "";
    return '<div class="card"><div class="row"><div><b>' + esc(p.name) + '</b> ' + dirTag(p.dir) +
      (p.secured ? ' <span class="tag warn">مؤمّنة</span>' : '') + '</div>' +
      '<b class="num ' + cls + '">' + (isFinite(upl) ? signed(upl) + " " + cur() : "—") + '</b></div>' +
      trackHtml(p) +
      '<div class="kv"><div><span>الحجم</span><b class="num">' + fmt(p.size, p.size < 10 ? 2 : 0) + '</b></div>' +
      '<div><span>الدخول</span><b class="num">' + px(p.entry) + '</b></div>' +
      '<div><span>السعر الآن</span><b class="num">' + px(p.now) + '</b></div></div></div>';
  }).join("");
}

function renderSettings(){
  var s = D.settings || {}, lim = s.daily_limit_eur > 0 ? fmt(s.daily_limit_eur, 0) + " " + cur() : (s.daily_limit_pct > 0 ? s.daily_limit_pct + "%" : "بلا حد");
  function r(k, v){ return '<div class="row" style="padding:4px 0"><span class="muted">' + k + '</span><b>' + v + '</b></div>'; }
  $("settings").innerHTML = r("أقصى خسارة للصفقة", s.risk_pct + "% من الرصيد" + (s.trade_risk_eur > 0 ? " (حتى " + fmt(s.trade_risk_eur, 0) + " " + cur() + ")" : "")) +
    r("حد الخسارة اليومي", lim) + r("أقصى صفقات مفتوحة", s.max_open > 0 ? s.max_open : "بلا حد") +
    r("صفقات جديدة معاً (كل دورة)", s.max_new) + r("مسح الأسهم", s.stocks ? "مفعّل" : "متوقف") +
    r("الذكاء الاصطناعي", s.ai ? "مفعّل" : "بدونه (أخبار وميول)") + r("الأسواق الثابتة", esc((s.markets || []).join("، ")));
}

function renderEvents(){
  var el = $("events"), ev = D.events || [];
  if (!ev.length) { el.innerHTML = '<div class="empty" style="border:0">لم ينفّذ الروبوت أي عملية بعد.</div>'; return; }
  var out = "", last = "";
  ev.slice(0, 60).forEach(function(e){
    var k = dayKey(e.t);
    if (k !== last) { out += '<div class="day-h">' + dayLabel(k) + '</div>'; last = k; }
    var head, det = "";
    if (e.type === "open") {
      head = dirTag(e.dir) + ' <span class="tag neutral">' + (e.kind === "مرتدة" ? "مرتدة" : "إشارة") + '</span>';
      det = '<div class="kv"><div><span>الحجم</span><b class="num">' + fmt(e.size, e.size < 10 ? 2 : 0) + '</b></div><div><span>الوقف</span><b class="num">' + px(e.stop) + '</b></div><div><span>الهدف</span><b class="num">' + px(e.target) + '</b></div></div>' +
        '<div class="small muted" style="margin-top:6px">السعر <span class="num">' + px(e.price) + '</span>، أقصى خسارة <span class="num">' + fmt(e.risk, 2) + ' ' + cur() + '</span></div>';
    } else if (e.type === "secure") { head = '<span class="tag warn">تأمين</span>'; }
    else { head = '<span class="tag neutral">أُغلقت</span> ' + (e.dir ? dirTag(e.dir) : ""); }
    var news = (e.news && e.news.length) ? '<details><summary>الأخبار وقت الدخول (' + e.news.length + ')</summary><ul>' + e.news.map(function(n){ return '<li>' + esc(n) + '</li>'; }).join("") + '</ul></details>' : "";
    out += '<div class="ev"><div class="t num">' + hm(e.t) + '</div><div><div class="row" style="justify-content:flex-start;gap:8px"><span class="name">' + esc(e.name || e.epic) + '</span>' + head + '</div>' + det +
      (e.why ? '<div class="why">' + esc(e.why) + '</div>' : "") + news + '</div></div>';
  });
  el.innerHTML = out;
}

function renderHistory(){
  var el = $("history"), h = D.history || [];
  if (!h.length) { el.innerHTML = '<div class="empty" style="border:0">لا توجد نتائج مسجّلة في آخر 3 أيام.</div>'; return; }
  var total = h.reduce(function(a, r){ return a + (Number(r.pnl) || 0); }, 0);
  el.innerHTML = '<div class="row" style="padding-bottom:8px;border-bottom:1px solid var(--line)"><span class="muted">المجموع (آخر 3 أيام)</span><b class="num pnl ' + (total >= 0 ? "up" : "down") + '">' + signed(total) + ' ' + cur() + '</b></div>' +
    h.slice(0, 40).map(function(r){
      var p = Number(r.pnl) || 0;
      return '<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><div><b>' + esc(r.name || "—") + '</b><div class="small muted"><span class="num">' + dayLabel(dayKey(r.t)) + " " + hm(r.t) + '</span></div></div><b class="num pnl ' + (p >= 0 ? "up" : "down") + '">' + signed(p) + ' ' + cur() + '</b></div>';
    }).join("");
}

function meterHtml(score){
  var s = Math.max(-100, Math.min(100, Number(score) || 0)), w = Math.abs(s) / 2;
  var st = s >= 0 ? 'left:50%;width:' + w + '%;background:var(--buy)' : 'right:50%;width:' + w + '%;background:var(--sell)';
  return '<div class="meter"><i style="' + st + '"></i></div><div class="meter-l"><span>بيع</span><span>التحليل الفني ' + (s > 0 ? "+" : "") + s + '</span><span>شراء</span></div>';
}

function renderMarkets(){
  var sc = D.scan || {};
  $("scan").textContent = sc.stocks_on ? ("تم مسح " + sc.universe + " سهماً، وتحليل أفضل " + sc.analyzed + " منها مع الذهب والنفط.") : "مسح الأسهم متوقف، الروبوت يتابع الذهب والنفط فقط.";
  var el = $("markets"), m = D.markets || [];
  if (!m.length) { el.innerHTML = '<div class="empty">لا يوجد تحليل في آخر دورة. ربما الأسواق مغلقة أو الحد اليومي بلغ.</div>'; return; }
  el.innerHTML = m.map(function(x){
    var verdict = x.verdict ? '<span class="tag ' + (x.verdict === "BUY" ? "buy" : "sell") + '">إشارة ' + (x.verdict === "BUY" ? "شراء" : "بيع") + '</span>' : '<span class="tag neutral">لا دخول</span>';
    var crowd = "";
    if (x.long != null) crowd = '<div class="small muted" style="margin-top:8px">ميول المتداولين: <b class="num">' + fmt(x.long, 0) + '%</b> شراء، <b class="num">' + fmt(100 - x.long, 0) + '%</b> بيع</div><div class="crowd"><i style="width:' + (100 - x.long) + '%;background:var(--sell)"></i><i style="width:' + x.long + '%;background:var(--buy)"></i></div>';
    var news = (x.news && x.news.length) ? '<div class="small" style="margin-top:8px"><span class="muted">الأخبار</span>' + (x.news_score != null ? ' <span class="tag ' + (x.news_score > 0.1 ? "buy" : x.news_score < -0.1 ? "sell" : "neutral") + '">' + (x.news_score > 0.1 ? "إيجابية" : x.news_score < -0.1 ? "سلبية" : "محايدة") + '</span>' : "") + '<ul class="heads">' + x.news.map(function(n){ return '<li>' + esc(n) + '</li>'; }).join("") + '</ul></div>' : "";
    var why = x.rebound ? "مرتدة: " + x.rebound : (x.why || (x.ctx && x.ctx.reason) || "");
    return '<div class="card"><div class="row"><div><b>' + esc(x.name) + '</b> <span class="muted small num">' + px(x.price) + '</span></div>' + verdict + '</div>' + meterHtml(x.tech) +
      (why ? '<div class="small muted" style="margin-top:6px">' + esc(why) + '</div>' : "") + crowd + news + '</div>';
  }).join("");
}

function renderLog(){
  var l = D.log || [];
  $("log").innerHTML = l.length ? l.slice().reverse().map(function(t){ return '<div dir="auto">' + esc(t) + '</div>'; }).join("") : '<div class="muted">السجل فارغ.</div>';
}

function renderAll(){ renderHead(); renderOpen(); renderSettings(); renderEvents(); renderHistory(); renderMarkets(); renderLog(); }

/* ===== التحميل ===== */
var busy = false;
function load(){
  if (busy) return; busy = true;
  var url = SRC + (SRC.indexOf("?") > -1 ? "&" : "?") + "t=" + Date.now();
  fetch(url, {cache:"no-store"}).then(function(r){
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function(j){ D = j; renderAll(); }).catch(function(e){
    if (!D) {
      $("stat").textContent = "تعذّر التحميل";
      $("banner").innerHTML = '<div class="banner err">تعذّر قراءة بيانات الروبوت (' + esc(e.message) + '). تأكد أن الـ repo عام (Public) وأن الروبوت اشتغل مرة واحدة على الأقل بعد إضافة النشر. بعدها اضغط تحديث.</div>';
    } else {
      $("stat").textContent = "تعذّر التحديث، أعرض آخر بيانات محمّلة";
    }
  }).then(function(){ busy = false; });
}

function setTab(name){
  document.querySelectorAll("section.tab").forEach(function(s){ s.classList.toggle("on", s.id === "tab-" + name); });
  document.querySelectorAll("nav button").forEach(function(b){ b.classList.toggle("on", b.dataset.tab === name); });
  try { localStorage.setItem("bot_tab", name); } catch(e){}
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach(function(b){ b.addEventListener("click", function(){ setTab(b.dataset.tab); }); });
$("refresh").addEventListener("click", load);
try { var t = localStorage.getItem("bot_tab"); if (t && document.getElementById("tab-" + t)) setTab(t); } catch(e){}
document.addEventListener("visibilitychange", function(){ if (!document.hidden) load(); });
setInterval(function(){ if (!document.hidden) load(); }, 60000);
setInterval(function(){ if (D) renderHead(); }, 30000);
load();
</script>
</body>
